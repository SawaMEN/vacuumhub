name: Native Linux tests and releases
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - name: Go tests with race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet ./...
      - name: Build native server
        run: CGO_ENABLED=1 go build -o /tmp/vacuumhub-test ./cmd/vacuumhub

  installer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test IP/domain-only menu and native scripts
        run: bash tests/native-installer.sh
      - name: Verify embedded manager and unit
        run: |
          grep -q 'User=vacuumhub' deploy/vacuumhub.service
          grep -q 'EnvironmentFile=/etc/vacuumhub/environment' deploy/vacuumhub.service
          ! grep -q 'Docker Compose' install.sh
          ! grep -q 'Только локально' install.sh

  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check web/app.js && node --check web/admin.js

  static-linux:
    needs: [go-tests, installer-tests, web-tests]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build portable static executable in CI
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --file build/Dockerfile.static \
            --output type=local,dest=dist-binary .
          test -s dist-binary/vacuumhub
          ! readelf -l dist-binary/vacuumhub | grep -q INTERP
      - name: Package native systemd release
        run: |
          mkdir -p pkg/deploy pkg/scripts dist
          install -m 0755 dist-binary/vacuumhub pkg/vacuumhub
          install -m 0755 install.sh pkg/install.sh
          install -m 0755 deploy/vacuumhub pkg/deploy/vacuumhub
          cp deploy/vacuumhub.service deploy/vacuumhub-cert-renew.service deploy/vacuumhub-cert-renew.timer pkg/deploy/
          install -m 0755 scripts/backup-native.sh pkg/scripts/backup-native.sh
          install -m 0755 scripts/restore-drill-native.sh pkg/scripts/restore-drill-native.sh
          install -m 0755 scripts/restore-native.sh pkg/scripts/restore-native.sh
          tar -czf dist/vacuumhub-linux-${{ matrix.arch }}.tar.gz -C pkg \
            vacuumhub install.sh deploy scripts
      - uses: actions/upload-artifact@v4
        with:
          name: vacuumhub-linux-${{ matrix.arch }}
          path: dist/vacuumhub-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: static-linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vacuumhub-linux-*
          merge-multiple: true
          path: dist
      - name: Check both architectures and hash release assets
        run: |
          test -s dist/vacuumhub-linux-amd64.tar.gz
          test -s dist/vacuumhub-linux-arm64.tar.gz
          (cd dist && sha256sum vacuumhub-linux-*.tar.gz > SHA256SUMS)
      - name: Publish verified native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.7.${{ github.run_number }}"
          gh release create "$TAG" \
            dist/vacuumhub-linux-amd64.tar.gz \
            dist/vacuumhub-linux-arm64.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "VacuumHub $TAG — native systemd" \
            --notes "Native HTTPS-only IP/domain installation. No Docker on the VDS; amd64/arm64 binaries with embedded web UI and SQLite." \
            --latest
