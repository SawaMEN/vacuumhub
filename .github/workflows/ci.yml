name: Test and build
on:
  push:
  pull_request:
jobs:
  go-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install SQLite development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev gcc
      - name: Test
        run: CGO_ENABLED=1 go test -race ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet ./...
      - name: Build binary
        run: CGO_ENABLED=1 go build -o /tmp/vacuumhub ./cmd/vacuumhub
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test stopped-volume backup / isolated restore
        run: |
          cp .env.example .env
          chmod 600 .env
          docker compose --env-file .env -f deploy/compose.yaml up -d --build app
          trap 'docker compose --env-file .env -f deploy/compose.yaml logs --tail=60 app || true; docker compose --env-file .env -f deploy/compose.yaml down -v || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if docker compose --env-file .env -f deploy/compose.yaml exec -T app /usr/local/bin/vacuumhub --healthcheck; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = 1
          sh scripts/backup.sh
          ARCHIVE=$(find backups -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$ARCHIVE"
          sh scripts/restore-drill.sh "$ARCHIVE"

  js-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check web/app.js && node --check web/admin.js

  ops-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check maintenance script syntax
        run: |
          sh -n scripts/backup.sh
          sh -n scripts/restore-drill.sh
          sh -n scripts/restore.sh
      - name: Validate Docker Compose configuration
        run: |
          DOMAIN=vacuum.example.org ADMIN_API_TOKEN=test-secret-value-over-24-chars ADMIN_BASIC_USER=test ADMIN_BASIC_HASH=test-bcrypt-placeholder \
            docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Validate Caddyfile with real bcrypt hash
        run: |
          HASH=$(docker run --rm caddy:2 caddy hash-password --plaintext test-password-for-CI)
          docker run --rm \
            -e DOMAIN=vacuum.example.org -e ADMIN_BASIC_USER=test -e ADMIN_BASIC_HASH="$HASH" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
