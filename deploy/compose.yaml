services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
      FIRMWARE_CLAMD_ADDR: ${FIRMWARE_CLAMD_ADDR:-}
      FIRMWARE_TRUSTED_KEYS: ${FIRMWARE_TRUSTED_KEYS:-}
    volumes:
      - vacuumhub_data:/data
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 120
    mem_limit: 512m
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app
volumes:
  vacuumhub_data:
  caddy_data:
  caddy_config:
networks:
  internal:
